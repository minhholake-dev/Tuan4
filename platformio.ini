[platformio]
default_envs = main
src_dir = .
core_dir = ../.tools/platformio
build_cache_dir = ../.tools/build-cache

[env]
platform = espressif32 @ 8.0.0
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/limit-build-jobs.py
lib_deps =
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ 7.4.2
build_src_filter = -<*> +<src/main.cpp>

[env:main]

[env:mqtt-publisher]
build_src_filter = -<*> +<bai-tap/bai-01-mqtt-publisher/main.cpp>

[env:mqtt-pubsub-publisher]
build_src_filter = -<*> +<bai-tap/bai-02-mqtt-pub-sub/publisher/main.cpp>

[env:mqtt-subscriber]
build_src_filter = -<*> +<bai-tap/bai-02-mqtt-pub-sub/subscriber/main.cpp>

[env:mqtt-led]
build_src_filter = -<*> +<bai-tap/bai-03-mqtt-led/main.cpp>
